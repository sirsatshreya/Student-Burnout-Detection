<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analytics | Student Well-Being Monitor</title>

<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="analytics.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="analytics-container">

<div class="analytics-header">

<div>

<h1>

<i class="fa-solid fa-chart-line"></i>

Analytics Dashboard

</h1>

<p>

Track your well-being trends and progress over time.

</p>

</div>

<a href="dashboard.html" class="backBtn">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</div>

<div class="stats-grid">

<div class="stat-card">

<i class="fa-solid fa-calendar-check"></i>

<h3>Total Check-Ins</h3>

<h2 id="totalCheckins">0</h2>

</div>

<div class="stat-card">

<i class="fa-solid fa-fire"></i>

<h3>Current Streak</h3>

<h2 id="currentStreak">0 Days</h2>

</div>

<div class="stat-card">

<i class="fa-solid fa-trophy"></i>

<h3>Longest Streak</h3>

<h2 id="longestStreak">0 Days</h2>

</div>

<div class="stat-card">

<i class="fa-solid fa-heart"></i>

<h3>Average Stress</h3>

<h2 id="avgStress">0</h2>

</div>

</div>

<div class="chart-grid">

<div class="chart-card">

<h3>Stress Trend</h3>

<canvas id="stressChart"></canvas>

</div>

<div class="chart-card">

<h3>Sleep Trend</h3>

<canvas id="sleepChart"></canvas>

</div>

<div class="chart-card">

<h3>Study Hours</h3>

<canvas id="studyChart"></canvas>

</div>

<div class="chart-card">

<h3>Motivation Trend</h3>

<canvas id="motivationChart"></canvas>

</div>

</div>

</div>

<script src="js/analytics.js"></script>

</body>
